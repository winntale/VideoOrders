services:
  orders-postgres:
    image: postgres:16
    container_name: orders-postgres
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_password
      POSTGRES_DB: orders_db
    ports:
      - "5433:5432"
    volumes:
      - orders_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  orders-rabbitmq:
    image: masstransit/rabbitmq:latest
    container_name: orders-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  notifications-mongo:
    image: mongo:7
    container_name: notifications-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: notifications_user
      MONGO_INITDB_ROOT_PASSWORD: notifications_password
      MONGO_INITDB_DATABASE: notifications_db
    ports:
      - "27017:27017"
    volumes:
      - notifications_mongo_data:/data/db
    restart: unless-stopped

  audit-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: audit-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  audit-kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: audit-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://audit-elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - audit-elasticsearch
    restart: unless-stopped

  processing-system:
    environment:
      - ArchiveStorage__RootPath=/app/storage/archive-results
      - ASPNETCORE_ENVIRONMENT=Development
    build:
      context: .
      dockerfile: ProcessingSystem/Dockerfile
      target: runtime
    container_name: processing-system
    volumes:
      - ./test-videos:/app/input
      - ./archive_storage:/app/storage/archive-results
      - ./logs:/app/logs
    depends_on:
      - orders-rabbitmq
    restart: unless-stopped

volumes:
  orders_postgres_data:
  rabbitmq_data:
  notifications_mongo_data:
  elasticsearch_data:
  archive_storage: